<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Siam - IT Professional & Umrah Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-950 text-neutral-100 font-sans antialiased selection:bg-amber-500 selection:text-neutral-950">

    <!-- Hero Section -->
    <section class="relative min-h-screen flex items-center justify-center px-6 lg:px-16 py-20 overflow-hidden">
        <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

            <!-- ৩. ডান পাশের সেকশন (আপনার ছবি + ব্যাকগ্রাউন্ড টাওয়ার অ্যানিমেশন সহ) -->
            <div class="lg:col-span-5 flex justify-center lg:justify-end relative">
                <!-- Warm Orange Ambient Glow Behind Portrait -->
                <div
                    class="absolute -inset-2 bg-gradient-to-r from-amber-500/30 to-orange-600/30 rounded-[2.5rem] blur-2xl opacity-70 group-hover:opacity-100 transition-opacity">
                </div>

                <div
                    class="relative w-full max-w-lg aspect-[4/5] rounded-3xl overflow-hidden border border-amber-500/30 shadow-2xl group bg-neutral-900/80 backdrop-blur-sm">

                    <!-- আপনার মক্কা টাওয়ার সহ আসল ছবিটি -->
                    <img src="/siam-hero.jpg" alt="MD Siam - AI App Developer & Umrah Specialist"
                        onerror="this.onerror=null; this.src='https://placeholder.co/600x750/151515/FF8A00?text=MD+Siam';"
                        class="w-full h-full object-cover object-top transition-transform duration-700 ease-out group-hover:scale-105">

                    <!-- গ্র্যাডিয়েন্ট ওভারলে ও ওয়ার্ম অ্যামিয়েন্ট ব্যাকড্রপ -->
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/20 to-transparent opacity-85">
                    </div>

                    <!-- সুক্ষ্ম অরেঞ্জ অ্যামিয়েন্ট গ্লো লাইন -->
                    <div
                        class="absolute inset-0 border-2 border-amber-500/20 rounded-3xl pointer-events-none group-hover:border-amber-500/50 transition-colors duration-500">
                    </div>

                    <!-- প্রিমিয়াম ও চোখের জন্য আরামদায়ক নাম কার্ড -->
                    <div
                        class="absolute bottom-6 right-6 text-right z-10 bg-gradient-to-l from-neutral-950/80 via-neutral-900/50 to-transparent backdrop-blur-sm px-5 py-3 rounded-2xl border-r-2 border-amber-500/60 shadow-xl transition-all duration-500 hover:translate-y-[-2px]">
                        <h3
                            class="font-serif italic text-xl md:text-2xl text-amber-400 font-semibold tracking-wider drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                            Md. Siam
                        </h3>
                        <p class="text-xs font-sans text-neutral-300 tracking-wider mt-1 opacity-85 font-light">
                            IT Professional & Umrah Operations
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </section>

</body>

</html>
